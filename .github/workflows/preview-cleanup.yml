name: Preview cleanup

# Deletes a branch's Worker Preview and Convex preview when its pull request
# closes or the branch is deleted. See docs/deploy.md.
on:
  pull_request:
    types: [closed]
  delete:

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.head.ref || github.event.ref }}

jobs:
  cleanup:
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete previews
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_MANAGEMENT_TOKEN: ${{ secrets.CONVEX_MANAGEMENT_TOKEN }}
        run: sh scripts/preview-delete.sh "$BRANCH"
